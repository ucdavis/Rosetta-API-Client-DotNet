###TYPES###

##Groups##
type GroupBucket {
  sourceName: String
  sourceId: String
  groups: [String]
}

type GroupSource {
  sourceName: String
  sourceId: String
}

type GroupMembership {
  name: String
  iamid: String
  loginId: String
  employeeId: String
  email: String
  groups: [GroupBucket]
}

type GroupMember {
  name: String
  iamid: String
  email: String
}

type GroupById {
  groupName: String
  groupSource: String
  groupId: String
  groupMembers: [GroupMember]
}

